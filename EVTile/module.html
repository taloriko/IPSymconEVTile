<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/icons.js"></script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { background: transparent; }

  .ev-tile {
    --bg: rgba(248, 250, 252, 0.98);
    --surface: rgba(255, 255, 255, 0.92);
    --surface-2: rgba(241, 245, 249, 0.88);
    --border: rgba(15, 23, 42, 0.10);
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.10);
    --ok: #15803d;
    --ok-soft: rgba(21, 128, 61, 0.11);
    --warn: #d97706;
    --warn-soft: rgba(217, 119, 6, 0.12);
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.11);
    --shadow: 0 14px 40px rgba(15, 23, 42, 0.10);
    min-height: 100%;
    color: var(--text);
    background: var(--bg);
    border-radius: 18px;
    padding: 18px;
    overflow: hidden;
  }

  @media (prefers-color-scheme: dark) {
    .ev-tile {
      --bg: rgba(15, 23, 42, 0.98);
      --surface: rgba(30, 41, 59, 0.88);
      --surface-2: rgba(51, 65, 85, 0.56);
      --border: rgba(226, 232, 240, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.14);
      --ok: #4ade80;
      --ok-soft: rgba(74, 222, 128, 0.12);
      --warn: #fbbf24;
      --warn-soft: rgba(251, 191, 36, 0.13);
      --danger: #fb7185;
      --danger-soft: rgba(251, 113, 133, 0.13);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
    }
  }

  .header { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
  .title-wrap { min-width: 0; }
  .title { margin: 0; font-size: clamp(20px, 3vw, 30px); font-weight: 760; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subline { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; color: var(--muted); font-size: 12px; }
  .pill { border: 1px solid var(--border); border-radius: 999px; padding: 4px 8px; background: var(--surface); }
  .freshness { text-align: right; color: var(--muted); font-size: 11px; min-width: 92px; padding-top: 3px; }

  .hero { display: grid; grid-template-columns: minmax(160px, 0.85fr) minmax(230px, 1.3fr); gap: 14px; margin-bottom: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
  .battery-card { padding: 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 185px; }
  .eyebrow { color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em; font-size: 10px; font-weight: 750; }
  .soc-line { display: flex; align-items: baseline; gap: 7px; margin: 4px 0 10px; }
  .soc-value { font-size: clamp(42px, 7vw, 64px); line-height: 1; font-weight: 800; letter-spacing: -0.055em; }
  .soc-unit { color: var(--muted); font-size: 18px; font-weight: 650; }
  .target { color: var(--muted); font-size: 12px; margin-top: 9px; }
  .segments { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; height: 12px; }
  .segment { border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); }
  .segment.on.full { background: #166534; border-color: #166534; }
  .segment.on.good { background: #65a30d; border-color: #65a30d; }
  .segment.on.low { background: #f59e0b; border-color: #f59e0b; }
  .segment.on.critical { background: #dc2626; border-color: #dc2626; }

  .car-card { position: relative; min-height: 185px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .car-halo { position: absolute; inset: 15% 12%; border-radius: 50%; background: radial-gradient(circle, var(--accent-soft), transparent 68%); pointer-events: none; }
  .car-svg { position: relative; width: 100%; max-height: 122px; color: var(--text); opacity: 0.94; }
  .car-meta { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; position: relative; }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { padding: 12px 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; min-width: 0; }
  .stat-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; }
  .stat-value { margin-top: 5px; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .status-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 999px; font-size: 11px; font-weight: 650; border: 1px solid var(--border); background: var(--surface); }
  .status-chip.ok { color: var(--ok); background: var(--ok-soft); }
  .status-chip.warn { color: var(--warn); background: var(--warn-soft); }
  .status-chip.danger { color: var(--danger); background: var(--danger-soft); }
  .status-chip.info { color: var(--accent); background: var(--accent-soft); }

  .lower-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .detail-card { padding: 14px; }
  .detail-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 760; }
  .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .detail-item { background: var(--surface-2); border-radius: 10px; padding: 9px 10px; min-width: 0; }
  .detail-label { color: var(--muted); font-size: 10px; }
  .detail-value { margin-top: 3px; font-size: 13px; font-weight: 680; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .notice { margin-top: 12px; border-radius: 12px; padding: 10px 12px; font-size: 12px; border: 1px solid var(--border); display: none; }
  .notice.warn { display: block; color: var(--warn); background: var(--warn-soft); }
  .notice.danger { display: block; color: var(--danger); background: var(--danger-soft); }

  .empty { display: none; min-height: 210px; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 26px; }
  .empty.visible { display: flex; }
  .empty-icon { font-size: 30px; margin-bottom: 8px; }
  .hidden { display: none !important; }

  @media (max-width: 720px) {
    .ev-tile { padding: 13px; border-radius: 14px; }
    .hero { grid-template-columns: 1fr; }
    .battery-card, .car-card { min-height: 150px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lower-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 430px) {
    .header { align-items: flex-start; }
    .freshness { min-width: 70px; }
    .detail-grid { grid-template-columns: 1fr 1fr; }
    .soc-value { font-size: 48px; }
  }
</style>
</head>
<body>
<div class="ev-tile">
  <div id="empty" class="empty">
    <div>
      <div class="empty-icon"><i class="fa-light fa-car"></i></div>
      <div id="emptyText"></div>
    </div>
  </div>

  <div id="content">
    <header class="header">
      <div class="title-wrap">
        <h1 class="title" id="vehicleName">Vehicle</h1>
        <div class="subline">
          <span class="pill hidden" id="platePill"></span>
          <span class="pill hidden" id="parkingPill"></span>
        </div>
      </div>
      <div class="freshness">
        <div id="updatedLabel"></div>
        <div id="updatedValue">—</div>
      </div>
    </header>

    <section class="hero">
      <div class="card battery-card">
        <div>
          <div class="eyebrow" id="batteryLabel"></div>
          <div class="soc-line">
            <div class="soc-value" id="socValue">—</div>
            <div class="soc-unit">%</div>
          </div>
        </div>
        <div>
          <div class="segments" id="segments"></div>
          <div class="target hidden" id="targetSoc"></div>
        </div>
      </div>

      <div class="card car-card">
        <div class="car-halo"></div>
        <svg class="car-svg" viewBox="0 0 720 260" aria-hidden="true">
          <path d="M155 177c13-47 42-83 89-101 42-16 189-17 236-1 49 17 83 53 101 102l48 14c20 6 34 24 34 45v8H57v-8c0-21 14-39 34-45l64-14Z" fill="currentColor" opacity="0.10"/>
          <path d="M149 176c15-50 45-87 94-105 45-17 190-18 239-1 51 18 86 55 104 106l45 13c20 6 33 23 33 44v5H56v-5c0-21 14-39 34-44l59-13Z" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
          <path d="M227 83 190 169h354l-57-88c-39-10-217-11-260 2Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" opacity="0.72"/>
          <path d="M342 82v87M462 81l31 88" stroke="currentColor" stroke-width="6" opacity="0.48"/>
          <circle cx="177" cy="228" r="31" fill="var(--bg)" stroke="currentColor" stroke-width="9"/>
          <circle cx="548" cy="228" r="31" fill="var(--bg)" stroke="currentColor" stroke-width="9"/>
          <path d="M87 195h70M566 195h70" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity="0.56"/>
        </svg>
        <div class="car-meta" id="carMeta"></div>
      </div>
    </section>

    <section class="stats" id="stats"></section>
    <section class="status-row" id="statusRow"></section>

    <section class="lower-grid">
      <div class="card detail-card hidden" id="chargingCard">
        <div class="detail-head"><i class="fa-light fa-bolt"></i><span id="chargingTitle"></span></div>
        <div class="detail-grid" id="chargingGrid"></div>
      </div>
      <div class="card detail-card hidden" id="climateCard">
        <div class="detail-head"><i class="fa-light fa-temperature-half"></i><span id="climateTitle"></span></div>
        <div class="detail-grid" id="climateGrid"></div>
      </div>
    </section>

    <div class="notice" id="diagnosticNotice"></div>
  </div>
</div>

<script>
  const tr = (text) => typeof translate === 'function' ? translate(text) : text;

  function parseState(data) {
    if (typeof data === 'string') {
      try { return JSON.parse(data); } catch (_) { return {}; }
    }
    return data && typeof data === 'object' ? data : {};
  }

  function setText(id, value) {
    const element = document.getElementById(id);
    if (element) element.textContent = value ?? '';
  }

  function setVisible(id, visible) {
    const element = document.getElementById(id);
    if (element) element.classList.toggle('hidden', !visible);
  }

  function valuePresent(value) {
    return value !== null && value !== undefined && value !== '';
  }

  function formatTimestamp(value) {
    if (!valuePresent(value) || Number(value) <= 0) return '—';
    try {
      return new Intl.DateTimeFormat(undefined, { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(Number(value) * 1000));
    } catch (_) {
      return '—';
    }
  }

  function batteryClass(soc) {
    const value = Number(soc);
    if (!Number.isFinite(value)) return 'good';
    if (value <= 10) return 'critical';
    if (value <= 25) return 'low';
    if (value < 80) return 'good';
    return 'full';
  }

  function renderBattery(soc, targetSoc) {
    const numeric = Number(soc);
    setText('socValue', Number.isFinite(numeric) ? Math.round(numeric) : '—');
    const root = document.getElementById('segments');
    root.replaceChildren();
    const active = Number.isFinite(numeric) ? Math.max(0, Math.min(20, Math.ceil(numeric / 5))) : 0;
    const cls = batteryClass(numeric);
    for (let i = 0; i < 20; i++) {
      const part = document.createElement('div');
      part.className = 'segment' + (i < active ? ' on ' + cls : '');
      root.appendChild(part);
    }
    setVisible('targetSoc', valuePresent(targetSoc));
    if (valuePresent(targetSoc)) setText('targetSoc', tr('Charging limit') + ': ' + targetSoc);
  }

  function addPill(containerId, text, className = '') {
    if (!valuePresent(text)) return;
    const chip = document.createElement('span');
    chip.className = 'status-chip ' + className;
    chip.textContent = text;
    document.getElementById(containerId).appendChild(chip);
  }

  function addStat(label, value) {
    if (!valuePresent(value)) return;
    const item = document.createElement('div');
    item.className = 'stat';
    const labelNode = document.createElement('div');
    labelNode.className = 'stat-label';
    labelNode.textContent = tr(label);
    const valueNode = document.createElement('div');
    valueNode.className = 'stat-value';
    valueNode.textContent = value;
    item.append(labelNode, valueNode);
    document.getElementById('stats').appendChild(item);
  }

  function addDetail(containerId, label, value) {
    if (!valuePresent(value)) return false;
    const item = document.createElement('div');
    item.className = 'detail-item';
    const labelNode = document.createElement('div');
    labelNode.className = 'detail-label';
    labelNode.textContent = tr(label);
    const valueNode = document.createElement('div');
    valueNode.className = 'detail-value';
    valueNode.textContent = value;
    item.append(labelNode, valueNode);
    document.getElementById(containerId).appendChild(item);
    return true;
  }

  function renderStatus(status) {
    const row = document.getElementById('statusRow');
    row.replaceChildren();
    if (status.locked === true) addPill('statusRow', tr('Locked'), 'ok');
    if (status.locked === false) addPill('statusRow', tr('Unlocked'), 'danger');
    if (status.doorsOpen === true) addPill('statusRow', tr('Doors open'), 'danger');
    if (status.windowsOpen === true) addPill('statusRow', tr('Windows open'), 'danger');
    if (status.trunkOpen === true) addPill('statusRow', tr('Trunk open'), 'danger');
    if (status.bonnetOpen === true) addPill('statusRow', tr('Bonnet open'), 'danger');
    if (status.sunroofOpen === true) addPill('statusRow', tr('Sunroof open'), 'warn');
    if (status.lightsOn === true) addPill('statusRow', tr('Lights on'), 'warn');
  }

  function renderCharging(charging) {
    const grid = document.getElementById('chargingGrid');
    grid.replaceChildren();
    let any = false;
    if (charging.active !== null && charging.active !== undefined) {
      any = addDetail('chargingGrid', 'Charging', charging.active ? tr('Active') : tr('Off')) || any;
    }
    any = addDetail('chargingGrid', 'Charging state', charging.state) || any;
    any = addDetail('chargingGrid', 'Charging power', charging.power) || any;
    any = addDetail('chargingGrid', 'Charging limit', charging.targetSoc) || any;
    any = addDetail('chargingGrid', 'Charge type', charging.type) || any;
    any = addDetail('chargingGrid', 'Charging mode', charging.mode) || any;
    if (valuePresent(charging.fullyChargedAt)) {
      any = addDetail('chargingGrid', 'Fully charged at', formatTimestamp(charging.fullyChargedAt)) || any;
    }
    setVisible('chargingCard', any);
  }

  function renderClimate(climate) {
    const grid = document.getElementById('climateGrid');
    grid.replaceChildren();
    let any = false;
    if (climate.active !== null && climate.active !== undefined) {
      any = addDetail('climateGrid', 'Air conditioning', climate.active ? tr('Active') : tr('Off')) || any;
    }
    any = addDetail('climateGrid', 'Target temperature', climate.targetTemperature) || any;
    setVisible('climateCard', any);
  }

  function renderDiagnostics(diagnostics) {
    const notice = document.getElementById('diagnosticNotice');
    notice.className = 'notice';
    notice.textContent = '';
    const messages = [];
    let severity = 'warn';
    if (diagnostics.apiKeyWarning === true) {
      messages.push(tr('API key warning is active'));
      severity = 'danger';
    }
    if (Number(diagnostics.newApiFeatures) > 0) {
      messages.push(tr('New API functions detected') + ': ' + Number(diagnostics.newApiFeatures));
    }
    if (valuePresent(diagnostics.partialErrors)) {
      messages.push(tr('The vehicle API reports partial errors'));
      severity = 'danger';
    }
    if (messages.length > 0) {
      notice.textContent = messages.join(' · ');
      notice.classList.add(severity);
    }
  }

  function handleMessage(data) {
    const state = parseState(data);
    const available = state.available === true;
    document.getElementById('empty').classList.toggle('visible', !available);
    document.getElementById('content').classList.toggle('hidden', !available);
    setText('emptyText', tr('Select a vehicle instance and apply the configuration.'));
    if (!available) return;

    const vehicle = state.vehicle || {};
    const battery = state.battery || {};
    const status = state.status || {};
    const charging = state.charging || {};
    const climate = state.climate || {};
    const diagnostics = state.diagnostics || {};

    setText('vehicleName', vehicle.name || tr('Vehicle'));
    setText('updatedLabel', tr('Updated'));
    setText('updatedValue', formatTimestamp(vehicle.lastUpdate));
    setText('batteryLabel', tr('State of charge'));
    setText('chargingTitle', tr('Charging'));
    setText('climateTitle', tr('Climate'));

    setVisible('platePill', valuePresent(vehicle.plate));
    if (valuePresent(vehicle.plate)) setText('platePill', vehicle.plate);
    setVisible('parkingPill', valuePresent(vehicle.parkingState));
    if (valuePresent(vehicle.parkingState)) setText('parkingPill', vehicle.parkingState);

    renderBattery(battery.soc, charging.targetSoc);

    const stats = document.getElementById('stats');
    stats.replaceChildren();
    addStat('Range', vehicle.range);
    addStat('Mileage', vehicle.mileage);
    addStat('Parking state', vehicle.parkingState);
    if (valuePresent(charging.power)) addStat('Charging power', charging.power);

    const meta = document.getElementById('carMeta');
    meta.replaceChildren();
    if (charging.active === true) addPill('carMeta', tr('Charging active'), 'info');
    if (climate.active === true) addPill('carMeta', tr('Climate active'), 'info');

    renderStatus(status);
    renderCharging(charging);
    renderClimate(climate);
    renderDiagnostics(diagnostics);
  }
</script>
</body>
</html>
